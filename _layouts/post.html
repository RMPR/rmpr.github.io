---
layout: default
---

<article class="prose">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>

  {{ content }}

  {% if page.tags and page.tags.size > 0 %}
    <div class="post-tags">
      {% for tag in page.tags %}<a href="{{ site.baseurl }}/tags/#{{ tag | slugify }}">#{{ tag }}</a>{% endfor %}
    </div>
  {% endif %}

  <nav class="post-nav">
    <a href="{{ site.baseurl }}/">&larr; All posts</a>
  </nav>

  <div class="comments">
    <script src="https://utteranc.es/client.js"
          repo="rmpr/rmpr.github.io"
          issue-term="pathname"
          theme="preferred-color-scheme"
          crossorigin="anonymous"
          async>
    </script>
  </div>
</article>
