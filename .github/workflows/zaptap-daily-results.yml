# Posts the ZapTap leaderboard to Teams at 16:00 Oslo time on working days.
#
# One run a weekday at 12:37 UTC (13:37 Oslo in winter, 14:37 in summer):
# off the hour, when GitHub is least busy, and early, because GitHub can
# start scheduled runs hours late. A run that starts before 16:00 Oslo time
# waits until then; a late one posts straight away. The API decides the
# rest: it only posts from 16:00 Oslo time, skips weekends and Norwegian
# holidays, and never posts twice the same day.
#
# Needs, in the repository settings (Settings > Secrets and variables > Actions):
#   variable ZAPTAP_URL  the site, e.g. https://<name>.azurestaticapps.net
#
# Running it by hand follows the same rules: it can't post early or twice.
name: ZapTap daily results

on:
  schedule:
    - cron: "37 12 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for 16:00 in Oslo
        if: github.event_name == 'schedule'
        run: |
          wait=$(( $(TZ=Europe/Oslo date -d "16:00:30" +%s) - $(date +%s) ))
          # Over 3.5 h means GitHub started us after midnight: nothing to wait for.
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 12600 ]; then
            echo "Waiting $((wait / 60)) minutes"
            sleep "$wait"
          fi
      - name: Ask ZapTap to post today's results
        env:
          ZAPTAP_URL: ${{ vars.ZAPTAP_URL }}
        run: |
          if [ -z "$ZAPTAP_URL" ]; then
            echo "::error::Set the ZAPTAP_URL variable in the repository settings."
            exit 1
          fi
          curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST "${ZAPTAP_URL%/}/api/report"
          echo
