name = "zaptap"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Only the workers.dev URL, which Cloudflare Access protects. Preview URLs
# would be a way around it.
workers_dev = true
preview_urls = false

# The game's static files, served from the same origin as the API so the
# Access login cookie just works. See ../.assetsignore for what's left out.
[assets]
directory = ".."
binding = "ASSETS"

[vars]
# From Workers > zaptap > Settings > Domains & Routes > workers.dev >
# Cloudflare Access, once enabled (see README.md).
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_THE_APPLICATION_AUD"
# Only these accounts may play, even if the Access policy is looser.
ALLOWED_EMAIL_DOMAIN = "zivid.com"

[[d1_databases]]
binding = "DB"
database_name = "zaptap"
# Paste the id printed by `npx wrangler d1 create zaptap` here.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
